apply plugin: 'com.android.application'

android {
    namespace 'dev.proxyroute'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.proxyroute'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '1.0.0'
    }

    buildFeatures { buildConfig = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }
}

dependencies { implementation files('libs/tunnel.aar') }
